[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genmitsu"
version = "0.1.0"
description = "Genmitsu PROVerXL 4030 V2 (GRBL 1.1h) を XYZ ステージとして制御する"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.scripts]
genmitsu-gui = "genmitsu.gui:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["genmitsu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/hardware は実機が動くので、pytest では集めない(手で実行する)
norecursedirs = ["hardware"]
